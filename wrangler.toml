name = "tools"
compatibility_date = "2026-07-14"
main = "worker/index.ts"

# Static site: everything the build emits into dist/ is served directly by
# Cloudflare's asset layer. Requests that don't match a built file (e.g.
# /annotate/api/fetch) fall through to the Worker in `main`.
[assets]
directory = "./dist"
